[package]
name = "wrevive-macro"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
blake2 = "0.10"
digest = "0.10"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.0"
once_cell = "1.0"

[features]
default = []