[package]
name = "cargo-wrevive"
version = "0.1.0"
edition = "2024"
description = "Cargo subcommand: cargo wrevive build — build PolkaVM contract (includes PvmBuilder lib for build.rs)"

[[bin]]
name = "cargo-wrevive"
path = "src/main.rs"

[dependencies]
cargo-pvm-contract-builder = { workspace = true }
anyhow = { workspace = true }
polkavm-linker = { workspace = true }
toml_edit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
