[package]
name = "wrevive-api"
version = "0.1.0"
edition = "2024"
description = "pallet_revive_uapi 封装：on_chain（真实 Host）/ off_chain（Engine 测试），参考 ink engine"

[features]
default = ["off_chain"]
off_chain = []
on_chain = []

[dependencies]
primitive-types = { workspace = true }
pvm-contract-sdk = { workspace = true }
pvm-contract-macros = { workspace = true }
pvm-contract-types = { workspace = true }
pallet-revive-uapi = { workspace = true }
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
sha3 = { workspace = true }
alloy-core = { version = "1.5", default-features = false, features = ["sol-types"] }

[dev-dependencies]
pvm-contract-types = { workspace = true, features = ["alloc"] }
