[workspace]
members = [
    "crates/cargo-wrevive",
    "crates/wrevive-macro",
    "crates/wrevive-api",
    "examples/wrevive-contract",
    "examples/wrevive-delegate",
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
