[package]
name = "flipper"
version = "0.1.0"
edition = "2021"
description = "ink 风格 Flipper 示例：布尔状态 flip/get，对应 ink/integration-tests/public/flipper"

[features]
default = []

[lib]
name = "flipper"
crate-type = ["cdylib"]

[build-dependencies]
polkavm-linker = "0.30"

[dependencies]
wrevive-macro = { path = "../../crates/wrevive-macro" }
wrevive-api = { path = "../../crates/wrevive-api", default-features = false, features = ["on_chain"] }

[dev-dependencies]
wrevive-api = { path = "../../crates/wrevive-api", default-features = false, features = ["off_chain"] }
