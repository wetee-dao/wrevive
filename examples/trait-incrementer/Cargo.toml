[package]
name = "trait-incrementer"
version = "0.1.0"
edition = "2021"
description = "ink 风格 Trait Incrementer：inc_by/inc/get/reset，对应 ink/integration-tests/public/trait-incrementer"

[features]
default = []

[lib]
name = "trait_incrementer"
crate-type = ["cdylib"]

[build-dependencies]
polkavm-linker = "0.30"

[dependencies]
wrevive-macro = { path = "../../crates/wrevive-macro" }
wrevive-api = { path = "../../crates/wrevive-api", default-features = false, features = ["on_chain"] }

[dev-dependencies]
wrevive-api = { path = "../../crates/wrevive-api", default-features = false, features = ["off_chain"] }
