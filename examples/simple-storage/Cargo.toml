[package]
name = "simple-storage"
version = "0.1.0"
edition = "2021"
description = "u32 键值存储，对应 ink contract-storage 的简化版"

[features]
default = []

[lib]
name = "simple_storage"
crate-type = ["cdylib"]

[build-dependencies]
polkavm-linker = "0.30"

[dependencies]
wrevive-macro = { path = "../../crates/wrevive-macro" }
wrevive-api = { path = "../../crates/wrevive-api", default-features = false, features = ["on_chain"] }

[dev-dependencies]
wrevive-api = { path = "../../crates/wrevive-api", default-features = false, features = ["off_chain"] }
