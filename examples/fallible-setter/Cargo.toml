[package]
name = "fallible-setter"
version = "0.1.0"
edition = "2021"
description = "ink 风格 FallibleSetter：try_set 可 revert，对应 ink/integration-tests/public/fallible-setter"

[features]
default = []

[lib]
name = "fallible_setter"
crate-type = ["cdylib"]

[build-dependencies]
polkavm-linker = "0.30"

[dependencies]
wrevive-macro = { path = "../../crates/wrevive-macro" }
wrevive-api = { path = "../../crates/wrevive-api", default-features = false, features = ["on_chain"] }

[dev-dependencies]
wrevive-api = { path = "../../crates/wrevive-api", default-features = false, features = ["off_chain"] }
